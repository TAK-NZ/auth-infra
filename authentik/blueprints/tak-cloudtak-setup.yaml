version: 1
metadata:
  name: TAK - CloudTAK Service Account Setup
  labels:
    blueprints.goauthentik.io/description: |
      Creates a dedicated, least-privilege service account and API token for
      CloudTAK. Scoped to exactly the object types CloudTAK's runtime code
      calls: Users (including password resets for machine users) and Groups.
      No access to Applications, Providers, Outposts, Flows, Stages,
      Policies, Tokens, or Blueprints is granted -- CloudTAK's deploy-time
      OIDC provider/application setup uses a separate, already-existing
      credential (cloudtak-oidc-setup Lambda) and is out of scope here.
context:
  token: !Env [AUTHENTIK_BOOTSTRAP_CLOUDTAK_TOKEN, null]
entries:
  - model: authentik_rbac.role
    id: cloudtak-role
    state: present
    identifiers:
      name: CloudTAK Service Role
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.add_user
        - authentik_core.delete_user
        - authentik_core.reset_user_password
        - authentik_core.view_group
        - authentik_core.add_user_to_group
  - model: authentik_core.user
    state: created
    id: cloudtak-service-account
    identifiers:
      username: tak-cloudtak-service
    attrs:
      name: CloudTAK Service Account
      type: service_account
      roles:
        - !KeyOf cloudtak-role
  - model: authentik_core.token
    state: present
    identifiers:
      identifier: tak-cloudtak-api-token
    attrs:
      key: !Context token
      user: !KeyOf cloudtak-service-account
      intent: api
      expiring: false
