# IP lock. The policy passes when the source IP's reputation score is at or below the threshold, so the deny
# stage bound to it runs only for an IP that has failed too often. Authentik subtracts 1 per failed login or
# identification and keeps the score for AUTHENTIK_REPUTATION__EXPIRY seconds. Each (IP, username) score is
# limited to -5 by default and the policy adds up the usernames seen from the IP. The default threshold here
# is far below any sum a real IP reaches, which switches the lock off; the stack sets TAK_IP_LOCK_THRESHOLD
# (default -5) when authentik.ipLock.enabled is true.
- model: authentik_policies_reputation.reputationpolicy
  identifiers:
    name: tak-brute-force-protection
  attrs:
    check_ip: true
    check_username: false
    execution_logging: false
    threshold: !Env [TAK_IP_LOCK_THRESHOLD, '-1000000']
