    enrollment_flow: !Find [authentik_flows.flow, [slug, tak-source-enrollment-email-verification]]
    group_matching_mode: identifier
    group_property_mappings: []
    name: Log in with Apple
    oidc_jwks_url: https://appleid.apple.com/auth/keys
    oidc_well_known_url: ''
    pkce: none
    policy_engine_mode: any
    profile_url: ''
    promoted: false
    provider_type: apple
    request_token_url: null
    user_matching_mode: identifier
    user_path_template: goauthentik.io/sources/%(slug)s
    user_property_mappings: []
- model: authentik_stages_authenticator_validate.authenticatorvalidatestage
