- model: authentik_stages_user_write.userwritestage
  identifiers:
    name: tak-link-social-provider
  attrs:
    create_users_as_inactive: false
    create_users_group: null
    user_creation_mode: never_create
    user_path_template: ''
    user_type: internal
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-source-enrollment-email-verification]]
    stage: !Find [authentik_stages_user_write.userwritestage, [name, tak-link-social-provider]]
    order: 30
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_user_write.userwritestage
  identifiers:
    name: tak-recovery-user-write
  attrs:
    create_users_as_inactive: false
    create_users_group: null
    user_creation_mode: never_create
    user_path_template: ''
    user_type: external
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    stage: !Find [authentik_stages_user_write.userwritestage, [name, tak-recovery-user-write]]
    order: 40
  attrs:
    evaluate_on_plan: true
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: false
- id: binding-4
  model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    stage: !Find [authentik_stages_captcha.captchastage, [name, tak-captcha-stage]]
    order: 5
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
  conditions:
  - !Env [TAK_CAPTCHA_SITE_KEY, '']
  - !Env [TAK_CAPTCHA_SECRET_KEY, '']
- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf 'flow-tak-source-authentication'
    order: 0
    policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-source-authentication-if-sso]]
  attrs:
    enabled: true
    failure_result: false
    negate: false
    timeout: 30
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-require-sso-context
  attrs:
    execution_logging: false
    expression: |-
      # Check if this flow is being executed from an SSO/OAuth source
      is_sso = request.context.get('is_sso', False)

      if not is_sso:
          ak_message("This enrollment flow can only be used with social login providers.")
          return False

      # Verify we have OAuth user info
      oauth_userinfo = request.context.get('oauth_userinfo')
      if not oauth_userinfo:
          ak_message("No OAuth provider information found.")
          return False

      # Verify we have a source
      source = request.context.get('source')
      if not source:
          ak_message("No identity provider source found.")
          return False

      return True
- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf 'flow-tak-source-enrollment-email-verification'
    order: 0
    policy: !Find [authentik_policies_expression.expressionpolicy, [name, tak-require-sso-context]]
  attrs:
    enabled: true
    failure_result: false
    negate: false
    timeout: 30
- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf 'binding-3'
    order: 0
    group: !Find [authentik_core.group, [name, authentik Admins]]
  attrs:
    enabled: true
    failure_result: false
    negate: false
    timeout: 30
- model: authentik_policies_reputation.reputationpolicy
  identifiers:
    name: tak-brute-force-protection
  attrs:
    check_ip: true
    check_username: false
    execution_logging: true
    threshold: -5
- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf 'binding-4'
    order: 0
    policy: !Find [authentik_policies_reputation.reputationpolicy, [name, tak-brute-force-protection]]
  attrs:
    enabled: true
    failure_result: false
    negate: false
    timeout: 30
  conditions:
  - !Env [TAK_CAPTCHA_SITE_KEY, '']
  - !Env [TAK_CAPTCHA_SECRET_KEY, '']
# True when the flow was NOT restored from a recovery link, so a link issued for a known user skips the
# identification stage. The upstream expression (bool(is_restored, True)) is always true and never skips.
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: default-recovery-skip-if-restored
  attrs:
    execution_logging: false
    expression: return not request.context.get('is_restored', False)
- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf 'binding-5'
    order: 0
    policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-recovery-skip-if-restored]]
  attrs:
    enabled: true
    failure_result: false
    negate: false
    timeout: 30
- model: authentik_stages_identification.identificationstage
  conditions:
  - !Env [TAK_CAPTCHA_SITE_KEY, '']
  - !Env [TAK_CAPTCHA_SECRET_KEY, '']
  identifiers:
    name: tak-authentication-identification
  attrs:
    case_insensitive_matching: true
    enable_remember_me: false
    enrollment_flow: !Find [authentik_flows.flow, [slug, tak-enrollment]]
    password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
    passwordless_flow: !Find [authentik_flows.flow, [slug, tak-passkey]]
    pretend_user_exists: true
    recovery_flow: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    show_matched_user: true
    show_source_labels: true
    sources:
    - !Find [authentik_sources_oauth.oauthsource, [slug, google]]
    - !Find [authentik_sources_oauth.oauthsource, [slug, apple]]
    user_fields:
    - username
    - email
    webauthn_stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, tak-authentication-webauthn]]
    captcha_stage: !Find [authentik_stages_captcha.captchastage, [name, tak-captcha-stage]]
