# TAK login experience: login, passkey login, password change, user settings, access request (enrollment) and
# password recovery, plus the IP lock that protects the login and recovery flows.
#
# One file on purpose. These objects reference each other in a circle (the identification stage links the
# recovery and enrollment flows), and splitting them made Authentik re-apply the same blueprints several times
# over.
#
# Objects are identified by slug or name, so the file works in any instance and adopts objects that were
# first created by hand. It is applied at startup and again whenever it changes. Objects that were removed
# from this file (social login, captcha) are deleted by tak-cleanup.yaml.
#
# Entries with `conditions` are skipped while their environment variables are empty, and left as they are if
# they already exist:
#   TAK_TEAM_MANAGER_URL    request-access redirect (https://team.<zone>); set by the stack
#
# IP lock (`tak-brute-force-protection` and `tak-ip-lock-deny`): a deny stage at the start of the login and
# recovery flows, reached only by an IP whose reputation score is at or below TAK_IP_LOCK_THRESHOLD. It
# is off unless the stack sets TAK_IP_LOCK_THRESHOLD (authentik.ipLock.enabled). Do not switch it on before
# the client IP can be trusted, see docs/WAF.md.
#
# `default-recovery-*` come from Authentik's example recovery blueprint, which this stack does not apply, so
# they are defined here under their existing names.
version: 1
metadata:
  name: TAK - Flows and sources
  labels:
    blueprints.goauthentik.io/description: |
      Login, passkey, password change, user settings, enrollment and recovery flows, and the IP lock on the login and recovery flows.
entries:
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Authentication flow
    required: true
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Password change flow
    required: true
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - User settings flow
    required: true
# Break-glass accounts (for example the CloudTAK local administrator). Members are skipped by the MFA
# rules and denied in the web login flows once those rules are in place. The blueprint only creates the
# group; the account that owns the sealed credential is added to it by the stack that creates the account.
- model: authentik_core.group
  identifiers:
    name: tak-break-glass
  attrs:
    is_superuser: false
- model: authentik_flows.flow
  identifiers:
    slug: tak-auth
  attrs:
    authentication: none
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: authentication
    layout: stacked
    name: tak-authentication-flow
    policy_engine_mode: any
    title: TAK.NZ Login
- model: authentik_flows.flow
  identifiers:
    slug: tak-enrollment
  attrs:
    authentication: none
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: enrollment
    layout: stacked
    name: tak-enrollment
    policy_engine_mode: any
    title: Request TAK.NZ Access
- model: authentik_flows.flow
  identifiers:
    slug: tak-passkey
  attrs:
    authentication: none
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: authentication
    layout: stacked
    name: tak-passwordless-flow
    policy_engine_mode: any
    title: TAK.NZ Login
- model: authentik_flows.flow
  identifiers:
    slug: tak-password-change
  attrs:
    authentication: require_authenticated
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: stage_configuration
    layout: stacked
    name: Change Password
    policy_engine_mode: any
    title: Change password
- model: authentik_flows.flow
  identifiers:
    slug: tak-recovery-flow
  attrs:
    authentication: require_unauthenticated
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: recovery
    layout: stacked
    name: TAK recovery flow
    policy_engine_mode: any
    title: Reset your password
- model: authentik_flows.flow
  identifiers:
    slug: tak-user-settings
  attrs:
    authentication: require_authenticated
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: stage_configuration
    layout: stacked
    name: User settings
    policy_engine_mode: any
    title: Update your info
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-password-change]]
    stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
    order: 0
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-password-change]]
    stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
    order: 1
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_authenticator_validate.authenticatorvalidatestage
  identifiers:
    name: tak-authentication-webauthn
  attrs:
    configuration_stages: []
    device_classes:
    - webauthn
    email_otp_throttling_factor: 1.0
    last_auth_threshold: seconds=0
    not_configured_action: skip
    sms_otp_throttling_factor: 1.0
    static_otp_throttling_factor: 1.0
    totp_otp_throttling_factor: 1.0
    webauthn_allowed_device_types: []
    webauthn_hints: []
    webauthn_user_verification: required
# Password stage of the login flow. Own copy instead of the default-authentication-password stage that the
# Authentik default blueprint owns and resets: the flow is cancelled after 3 wrong passwords, and only the
# standing-password and app-password backends are enabled (no Kerberos or LDAP source is configured).
- model: authentik_stages_password.passwordstage
  identifiers:
    name: tak-authentication-password
  attrs:
    allow_show_password: false
    backends:
    - authentik.core.auth.InbuiltBackend
    - authentik.core.auth.TokenBackend
    configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]
    failed_attempts_before_cancel: 3
- model: authentik_stages_identification.identificationstage
  identifiers:
    name: tak-authentication-identification
  attrs:
    captcha_stage: null
    case_insensitive_matching: true
    enable_remember_me: false
    enrollment_flow: !Find [authentik_flows.flow, [slug, tak-enrollment]]
    password_stage: !Find [authentik_stages_password.passwordstage, [name, tak-authentication-password]]
    passwordless_flow: !Find [authentik_flows.flow, [slug, tak-passkey]]
    pretend_user_exists: true
    recovery_flow: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    show_matched_user: true
    show_source_labels: false
    sources: []
    user_fields:
    - username
    - email
    webauthn_stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, tak-authentication-webauthn]]
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-auth]]
    stage: !Find [authentik_stages_identification.identificationstage, [name, tak-authentication-identification]]
    order: 10
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-passkey]]
    stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, tak-authentication-webauthn]]
    order: 10
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_redirect.redirectstage
  identifiers:
    name: tak-team-manager-request-access
  attrs:
    keep_context: true
    mode: static
    target_flow: null
    target_static: !Format ['%s/request-access', !Env 'TAK_TEAM_MANAGER_URL']
  conditions:
  - !Env [TAK_TEAM_MANAGER_URL, '']
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-enrollment]]
    stage: !Find [authentik_stages_redirect.redirectstage, [name, tak-team-manager-request-access]]
    order: 10
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
  conditions:
  - !Env [TAK_TEAM_MANAGER_URL, '']
- model: authentik_stages_identification.identificationstage
  identifiers:
    name: tak-recovery-identification
  attrs:
    captcha_stage: null
    case_insensitive_matching: true
    enable_remember_me: false
    enrollment_flow: null
    password_stage: null
    passwordless_flow: null
    pretend_user_exists: true
    recovery_flow: null
    show_matched_user: true
    show_source_labels: false
    sources: []
    user_fields:
    - username
    - email
    webauthn_stage: null
- id: binding-5
  model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    stage: !Find [authentik_stages_identification.identificationstage, [name, tak-recovery-identification]]
    order: 10
  attrs:
    evaluate_on_plan: true
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_user_login.userloginstage
  identifiers:
    name: tak-authentication-login
  attrs:
    geoip_binding: no_binding
    network_binding: no_binding
    remember_device: days=30
    remember_me_offset: seconds=0
    session_duration: seconds=0
    terminate_other_sessions: false
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-auth]]
    stage: !Find [authentik_stages_user_login.userloginstage, [name, tak-authentication-login]]
    order: 100
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-user-settings]]
    stage: !Find [authentik_stages_user_write.userwritestage, [name, default-user-settings-write]]
    order: 100
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_user_login.userloginstage
  identifiers:
    name: tak-recovery-user-login
  attrs:
    geoip_binding: no_binding
    network_binding: no_binding
    remember_device: days=30
    remember_me_offset: seconds=0
    session_duration: seconds=0
    terminate_other_sessions: false
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    stage: !Find [authentik_stages_user_login.userloginstage, [name, tak-recovery-user-login]]
    order: 100
  attrs:
    evaluate_on_plan: true
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: false
- model: authentik_stages_authenticator_validate.authenticatorvalidatestage
  identifiers:
    name: tak-authentication-mfa-validation
  attrs:
    configuration_stages: []
    device_classes:
    - static
    - totp
    - webauthn
    - duo
    - sms
    - email
    email_otp_throttling_factor: 1.0
    last_auth_threshold: seconds=0
    not_configured_action: skip
    sms_otp_throttling_factor: 1.0
    static_otp_throttling_factor: 1.0
    totp_otp_throttling_factor: 1.0
    webauthn_allowed_device_types: []
    webauthn_hints: []
    webauthn_user_verification: required
- id: binding-3
  model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-auth]]
    stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, tak-authentication-mfa-validation]]
    order: 20
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-passkey]]
    stage: !Find [authentik_stages_user_login.userloginstage, [name, tak-authentication-login]]
    order: 20
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_prompt.prompt
  identifiers:
    name: tak-readonly-user-settings-field-name
  attrs:
    field_key: name
    initial_value: |-
      try:
          return user.name
      except:
          return ''
    initial_value_expression: true
    label: Name
    order: 201
    placeholder: Name
    placeholder_expression: false
    required: false
    sub_text: ''
    type: text_read_only
- model: authentik_stages_prompt.prompt
  identifiers:
    name: tak-readonly-user-settings-field-email
  attrs:
    field_key: email
    initial_value: |-
      try:
          return user.email
      except:
          return ''
    initial_value_expression: true
    label: Email / Username
    order: 202
    placeholder: Email
    placeholder_expression: false
    required: false
    sub_text: Your Email address / TAK.NZ username
    type: text_read_only
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-user-settings-authorization
  attrs:
    execution_logging: false
    expression: |-
      from authentik.core.models import (
          USER_ATTRIBUTE_CHANGE_EMAIL,
          USER_ATTRIBUTE_CHANGE_NAME,
          USER_ATTRIBUTE_CHANGE_USERNAME
      )
      prompt_data = request.context.get("prompt_data")

      if not request.user.group_attributes(request.http_request).get(
          USER_ATTRIBUTE_CHANGE_EMAIL, request.http_request.tenant.default_user_change_email
      ):
          if prompt_data.get("email") != request.user.email:
              ak_message("Not allowed to change email address.")
              return False

      if not request.user.group_attributes(request.http_request).get(
          USER_ATTRIBUTE_CHANGE_NAME, request.http_request.tenant.default_user_change_name
      ):
          if prompt_data.get("name") != request.user.name:
              ak_message("Not allowed to change name.")
              return False

      return True
- model: authentik_stages_prompt.promptstage
  identifiers:
    name: tak-user-settings
  attrs:
    fields:
    - !Find [authentik_stages_prompt.prompt, [name, tak-readonly-user-settings-field-name]]
    - !Find [authentik_stages_prompt.prompt, [name, tak-readonly-user-settings-field-email]]
    validation_policies:
    - !Find [authentik_policies_expression.expressionpolicy, [name, tak-user-settings-authorization]]
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-user-settings]]
    stage: !Find [authentik_stages_prompt.promptstage, [name, tak-user-settings]]
    order: 20
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_email.emailstage
  identifiers:
    name: tak-recovery-email
  attrs:
    activate_user_on_success: false
    from_address: system@authentik.local
    host: localhost
    port: 25
    recovery_cache_timeout: minutes=5
    recovery_max_attempts: 5
    subject: Password Reset
    template: email/password_reset.html
    timeout: 10
    token_expiry: minutes=30
    use_global_settings: true
    use_ssl: false
    use_tls: false
    username: ''
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    stage: !Find [authentik_stages_email.emailstage, [name, tak-recovery-email]]
    order: 20
  attrs:
    evaluate_on_plan: true
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_prompt.prompt
  identifiers:
    name: default-recovery-field-password
  attrs:
    field_key: password
    initial_value: ''
    initial_value_expression: false
    label: Password
    order: 0
    placeholder: Password
    placeholder_expression: false
    required: true
    sub_text: ''
    type: password
- model: authentik_stages_prompt.prompt
  identifiers:
    name: default-recovery-field-password-repeat
  attrs:
    field_key: password_repeat
    initial_value: ''
    initial_value_expression: false
    label: Password (repeat)
    order: 1
    placeholder: Password (repeat)
    placeholder_expression: false
    required: true
    sub_text: ''
    type: password
- model: authentik_stages_prompt.promptstage
  identifiers:
    name: Change your password
  attrs:
    fields:
    - !Find [authentik_stages_prompt.prompt, [name, default-recovery-field-password]]
    - !Find [authentik_stages_prompt.prompt, [name, default-recovery-field-password-repeat]]
    validation_policies: []
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    stage: !Find [authentik_stages_prompt.promptstage, [name, Change your password]]
    order: 30
  attrs:
    evaluate_on_plan: true
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: false
- model: authentik_stages_user_write.userwritestage
  identifiers:
    name: tak-recovery-user-write
  attrs:
    create_users_as_inactive: false
    create_users_group: null
    user_creation_mode: never_create
    user_path_template: ''
    user_type: external
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    stage: !Find [authentik_stages_user_write.userwritestage, [name, tak-recovery-user-write]]
    order: 40
  attrs:
    evaluate_on_plan: true
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: false
- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf 'binding-3'
    order: 0
    group: !Find [authentik_core.group, [name, authentik Admins]]
  attrs:
    enabled: true
    failure_result: false
    negate: false
    timeout: 30
# IP lock. The policy passes when the source IP's reputation score is at or below the threshold, so the deny
# stage bound to it runs only for an IP that has failed too often. Authentik subtracts 1 per failed login or
# identification and keeps the score for AUTHENTIK_REPUTATION__EXPIRY seconds. Each (IP, username) score is
# limited to -5 by default and the policy adds up the usernames seen from the IP. The default threshold here
# is far below any sum a real IP reaches, which switches the lock off; the stack sets TAK_IP_LOCK_THRESHOLD
# (default -5) when authentik.ipLock.enabled is true.
- model: authentik_policies_reputation.reputationpolicy
  identifiers:
    name: tak-brute-force-protection
  attrs:
    check_ip: true
    check_username: false
    execution_logging: false
    threshold: !Env [TAK_IP_LOCK_THRESHOLD, '-1000000']
- model: authentik_stages_deny.denystage
  identifiers:
    name: tak-ip-lock-deny
  attrs:
    deny_message: Too many failed attempts from your network. Try again later.
- id: binding-ip-lock-auth
  model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-auth]]
    stage: !Find [authentik_stages_deny.denystage, [name, tak-ip-lock-deny]]
    order: 5
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf 'binding-ip-lock-auth'
    order: 0
    policy: !Find [authentik_policies_reputation.reputationpolicy, [name, tak-brute-force-protection]]
  attrs:
    enabled: true
    failure_result: false
    negate: false
    timeout: 30
- id: binding-ip-lock-recovery
  model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    stage: !Find [authentik_stages_deny.denystage, [name, tak-ip-lock-deny]]
    order: 5
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf 'binding-ip-lock-recovery'
    order: 0
    policy: !Find [authentik_policies_reputation.reputationpolicy, [name, tak-brute-force-protection]]
  attrs:
    enabled: true
    failure_result: false
    negate: false
    timeout: 30
# True when the flow was NOT restored from a recovery link, so a link issued for a known user skips the
# identification stage. The upstream expression (bool(is_restored, True)) is always true and never skips.
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: default-recovery-skip-if-restored
  attrs:
    execution_logging: false
    expression: return not request.context.get('is_restored', False)
- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf 'binding-5'
    order: 0
    policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-recovery-skip-if-restored]]
  attrs:
    enabled: true
    failure_result: false
    negate: false
    timeout: 30
