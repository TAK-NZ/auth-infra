# TAK login experience: login, passkey login, password change, user settings, access request (enrollment) and
# password recovery, plus the IP lock that protects the login and recovery flows.
#
# One file on purpose. These objects reference each other in a circle (the identification stage links the
# recovery and enrollment flows), and splitting them made Authentik re-apply the same blueprints several times
# over.
#
# Objects are identified by slug or name, so the file works in any instance and adopts objects that were
# first created by hand. It is applied at startup and again whenever it changes. Objects that were removed
# from this file (social login, captcha) are deleted by tak-cleanup.yaml.
#
# Entries with `conditions` are skipped while their environment variables are empty, and left as they are if
# they already exist:
#   TAK_TEAM_MANAGER_URL    request-access redirect (https://team.<zone>); set by the stack
#
# IP lock (`tak-brute-force-protection` and `tak-ip-lock-deny`): a deny stage at the start of the login and
# recovery flows, reached only by an IP whose reputation score is at or below TAK_IP_LOCK_THRESHOLD. It
# is off unless the stack sets TAK_IP_LOCK_THRESHOLD (authentik.ipLock.enabled). Do not switch it on before
# the client IP can be trusted, see docs/WAF.md.
#
# MFA (see docs/BLUEPRINTS.md): every human ends a web login with at least two authenticators, one of them a
# passkey or an authenticator app, and recovery codes count as the second. Administrators hold a passkey, which is
# all their login accepts, and the recovery codes as the second authenticator. Members of the tak-break-glass group are denied in the web login flows. The
# policies named `tak-mfa-*` decide which stage a user meets; the bindings in `tak-auth` and `tak-passkey` use
# them. The passkey, authenticator app and recovery code setup stages are the ones from Authentik's default
# blueprints, renamed in place (the user settings page lists them by their friendly name).
#
# The default login flow and the default password change flow are not used by this stack. They stay on every
# instance, so each is shut with a deny stage in front of its other stages.
#
# `default-recovery-*` come from Authentik's example recovery blueprint, which this stack does not apply, so
# they are defined here under their existing names.
version: 1
metadata:
  name: TAK - Flows and sources
  labels:
    blueprints.goauthentik.io/description: |
      Login, passkey, password change, user settings, enrollment and recovery flows, and the IP lock on the login and recovery flows.
entries:
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Authentication flow
    required: true
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Password change flow
    required: true
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - User settings flow
    required: true
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - WebAuthn MFA setup flow
    required: true
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - TOTP MFA setup flow
    required: true
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Static MFA setup flow
    required: true
# Break-glass accounts (for example the CloudTAK local administrator). Members are skipped by the MFA
# rules and denied in the web login flows once those rules are in place. The blueprint only creates the
# group; the account that owns the sealed credential is added to it by the stack that creates the account.
- model: authentik_core.group
  identifiers:
    name: tak-break-glass
  attrs:
    is_superuser: false
- model: authentik_flows.flow
  identifiers:
    slug: tak-auth
  attrs:
    authentication: none
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: authentication
    layout: stacked
    name: tak-authentication-flow
    policy_engine_mode: any
    title: TAK.NZ Login
- model: authentik_flows.flow
  identifiers:
    slug: tak-enrollment
  attrs:
    authentication: none
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: enrollment
    layout: stacked
    name: tak-enrollment
    policy_engine_mode: any
    title: Request TAK.NZ Access
- model: authentik_flows.flow
  identifiers:
    slug: tak-passkey
  attrs:
    authentication: none
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: authentication
    layout: stacked
    name: tak-passwordless-flow
    policy_engine_mode: any
    title: TAK.NZ Login
- model: authentik_flows.flow
  identifiers:
    slug: tak-change-password
  attrs:
    authentication: require_authenticated
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: stage_configuration
    layout: stacked
    name: Change Password
    policy_engine_mode: any
    title: Change password
- model: authentik_flows.flow
  identifiers:
    slug: tak-recovery-flow
  attrs:
    authentication: require_unauthenticated
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: recovery
    layout: stacked
    name: TAK recovery flow
    policy_engine_mode: any
    title: Your TAK.NZ account
- model: authentik_flows.flow
  identifiers:
    slug: tak-user-settings
  attrs:
    authentication: require_authenticated
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: stage_configuration
    layout: stacked
    name: User settings
    policy_engine_mode: any
    title: Update your info
# Password policy (NZISM 16.1.31): 16 characters, no composition rules, plus Authentik's local zxcvbn strength
# estimate, which rejects common and predictable passwords. The check against the online breached password
# list (check_have_i_been_pwned) is off: it sends a hash prefix to api.pwnedpasswords.com and the password
# change fails while that service is unreachable.
- model: authentik_policies_password.passwordpolicy
  identifiers:
    name: tak-password-policy
  attrs:
    amount_digits: 0
    amount_lowercase: 0
    amount_symbols: 0
    amount_uppercase: 0
    check_have_i_been_pwned: false
    check_static_rules: true
    check_zxcvbn: true
    error_message: Use at least 16 characters.
    execution_logging: false
    hibp_allowed_count: 0
    length_min: 16
    password_field: password
    zxcvbn_score_threshold: 2
# Password change (slug tak-change-password; the earlier tak-password-change was deleted, see tak-cleanup.yaml). The user
# settings page reaches this flow through the password stage `tak-authentication-password`.
# The current password comes first, through a password stage so that wrong guesses are counted (the flow ends after
# 3 and the IP reputation drops), and is skipped for an account that has no password yet.
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-password-has-usable-password
  attrs:
    execution_logging: false
    expression: return request.user.has_usable_password()
- model: authentik_stages_password.passwordstage
  identifiers:
    name: tak-password-change-current
  attrs:
    allow_show_password: false
    backends:
    - authentik.core.auth.InbuiltBackend
    configure_flow: null
    failed_attempts_before_cancel: 3
- model: authentik_stages_prompt.promptstage
  identifiers:
    name: tak-password-change-prompt
  attrs:
    fields:
    - !Find [authentik_stages_prompt.prompt, [name, default-password-change-field-password]]
    - !Find [authentik_stages_prompt.prompt, [name, default-password-change-field-password-repeat]]
    validation_policies:
    - !Find [authentik_policies_password.passwordpolicy, [name, tak-password-policy]]
- model: authentik_stages_user_write.userwritestage
  identifiers:
    name: tak-password-change-write
  attrs:
    create_users_as_inactive: false
    create_users_group: null
    user_creation_mode: never_create
    user_path_template: ''
    user_type: internal
- id: binding-password-change-current
  model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-change-password]]
    stage: !Find [authentik_stages_password.passwordstage, [name, tak-password-change-current]]
    order: 10
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_policies.policybinding
  identifiers:
    target: !KeyOf 'binding-password-change-current'
    order: 0
    policy: !Find [authentik_policies_expression.expressionpolicy, [name, tak-password-has-usable-password]]
  attrs:
    enabled: true
    failure_result: false
    negate: false
    timeout: 30
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-change-password]]
    stage: !Find [authentik_stages_prompt.promptstage, [name, tak-password-change-prompt]]
    order: 20
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-change-password]]
    stage: !Find [authentik_stages_user_write.userwritestage, [name, tak-password-change-write]]
    order: 30
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
# Shuts a default flow that this stack does not use. The deny stage runs before the other stages of the flow.
- model: authentik_stages_deny.denystage
  identifiers:
    name: tak-flow-disabled-deny
  attrs:
    deny_message: This page is not in use. Sign in from the TAK.NZ login page.
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
    stage: !Find [authentik_stages_deny.denystage, [name, tak-flow-disabled-deny]]
    order: -100
  attrs:
    evaluate_on_plan: true
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: false
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, default-password-change]]
    stage: !Find [authentik_stages_deny.denystage, [name, tak-flow-disabled-deny]]
    order: -100
  attrs:
    evaluate_on_plan: true
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: false
- model: authentik_stages_authenticator_validate.authenticatorvalidatestage
  identifiers:
    name: tak-authentication-webauthn
  attrs:
    configuration_stages: []
    device_classes:
    - webauthn
    email_otp_throttling_factor: 1.0
    last_auth_threshold: seconds=0
    not_configured_action: skip
    sms_otp_throttling_factor: 1.0
    static_otp_throttling_factor: 1.0
    totp_otp_throttling_factor: 1.0
    webauthn_allowed_device_types: []
    webauthn_hints: []
    webauthn_user_verification: required
# Password stage of the login flow. Own copy instead of the default-authentication-password stage that the
# Authentik default blueprint owns and resets: the flow is cancelled after 3 wrong passwords, and only the
# standing-password and app-password backends are enabled (no Kerberos or LDAP source is configured).
- model: authentik_stages_password.passwordstage
  identifiers:
    name: tak-authentication-password
  attrs:
    allow_show_password: false
    backends:
    - authentik.core.auth.InbuiltBackend
    - authentik.core.auth.TokenBackend
    configure_flow: !Find [authentik_flows.flow, [slug, tak-change-password]]
    failed_attempts_before_cancel: 3
# The default login flow is shut (see the deny stage above), and its password stage would add a second, dead
# "Change password" entry to the user settings page. Without a configure flow it is not listed. The backends
# are the ones Authentik ships.
- model: authentik_stages_password.passwordstage
  identifiers:
    name: default-authentication-password
  attrs:
    allow_show_password: false
    backends:
    - authentik.core.auth.InbuiltBackend
    - authentik.sources.kerberos.auth.KerberosBackend
    - authentik.sources.ldap.auth.LDAPBackend
    - authentik.core.auth.TokenBackend
    configure_flow: null
    failed_attempts_before_cancel: 5
- model: authentik_stages_identification.identificationstage
  identifiers:
    name: tak-authentication-identification
  attrs:
    captcha_stage: null
    case_insensitive_matching: true
    enable_remember_me: false
    enrollment_flow: !Find [authentik_flows.flow, [slug, tak-enrollment]]
    password_stage: !Find [authentik_stages_password.passwordstage, [name, tak-authentication-password]]
    passwordless_flow: !Find [authentik_flows.flow, [slug, tak-passkey]]
    pretend_user_exists: true
    recovery_flow: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    show_matched_user: true
    show_source_labels: false
    sources: []
    user_fields:
    - username
    - email
    webauthn_stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, tak-authentication-webauthn]]
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-auth]]
    stage: !Find [authentik_stages_identification.identificationstage, [name, tak-authentication-identification]]
    order: 10
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-passkey]]
    stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, tak-authentication-webauthn]]
    order: 10
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_redirect.redirectstage
  identifiers:
    name: tak-team-manager-request-access
  attrs:
    keep_context: true
    mode: static
    target_flow: null
    target_static: !Format ['%s/request-access', !Env 'TAK_TEAM_MANAGER_URL']
  conditions:
  - !Env [TAK_TEAM_MANAGER_URL, '']
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-enrollment]]
    stage: !Find [authentik_stages_redirect.redirectstage, [name, tak-team-manager-request-access]]
    order: 10
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
  conditions:
  - !Env [TAK_TEAM_MANAGER_URL, '']
- model: authentik_stages_identification.identificationstage
  identifiers:
    name: tak-recovery-identification
  attrs:
    captcha_stage: null
    case_insensitive_matching: true
    enable_remember_me: false
    enrollment_flow: null
    password_stage: null
    passwordless_flow: null
    pretend_user_exists: true
    recovery_flow: null
    show_matched_user: true
    show_source_labels: false
    sources: []
    user_fields:
    - username
    - email
    webauthn_stage: null
- id: binding-5
  model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-recovery-flow]]
    stage: !Find [authentik_stages_identification.identificationstage, [name, tak-recovery-identification]]
    order: 10
  attrs:
    evaluate_on_plan: true
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_user_login.userloginstage
  identifiers:
    name: tak-authentication-login
  attrs:
    geoip_binding: no_binding
    network_binding: no_binding
    remember_device: days=30
    remember_me_offset: seconds=0
    session_duration: seconds=0
    terminate_other_sessions: false
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-auth]]
    stage: !Find [authentik_stages_user_login.userloginstage, [name, tak-authentication-login]]
    order: 100
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-user-settings]]
    stage: !Find [authentik_stages_user_write.userwritestage, [name, default-user-settings-write]]
    order: 100
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
# --- MFA -------------------------------------------------------------------------------------------------
# Policies. They run for the user who is signing in (the identified user, or the logged-in user in a settings flow).
# An authenticator is a passkey, an authenticator app, or the set of recovery codes (counted once, and only while
# unused codes are left).
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-mfa-is-admin
  attrs:
    execution_logging: false
    expression: return request.user.is_superuser
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-mfa-is-break-glass
  attrs:
    execution_logging: false
    expression: return request.user.groups.filter(name='tak-break-glass').exists()
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-mfa-has-authenticator
  attrs:
    execution_logging: false
    expression: return ak_user_has_authenticator(request.user)
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-mfa-has-passkey-or-app
  attrs:
    execution_logging: false
    expression: |-
      from authentik.stages.authenticator_static.models import StaticToken
      from authentik.stages.authenticator_totp.models import TOTPDevice
      from authentik.stages.authenticator_webauthn.models import WebAuthnDevice
      user = request.user
      passkeys = WebAuthnDevice.objects.filter(user=user, confirmed=True).count()
      apps = TOTPDevice.objects.filter(user=user, confirmed=True).count()
      codes = StaticToken.objects.filter(device__user=user, device__confirmed=True).exists()
      return passkeys + apps > 0
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-mfa-fewer-than-two-authenticators
  attrs:
    execution_logging: false
    expression: |-
      from authentik.stages.authenticator_static.models import StaticToken
      from authentik.stages.authenticator_totp.models import TOTPDevice
      from authentik.stages.authenticator_webauthn.models import WebAuthnDevice
      user = request.user
      passkeys = WebAuthnDevice.objects.filter(user=user, confirmed=True).count()
      apps = TOTPDevice.objects.filter(user=user, confirmed=True).count()
      codes = StaticToken.objects.filter(device__user=user, device__confirmed=True).exists()
      return passkeys + apps + (1 if codes else 0) < 2
# RETIRED. An administrator used to need two passkeys, and this policy (fewer than two) gated the bindings that asked for a
# second one. Authentik does not exclude the existing passkeys from a registration, so a second passkey made on the same
# device replaces the first, and the rule is now one passkey plus the recovery codes (see the end of this file). A
# blueprint cannot delete a binding, so an instance that had those bindings keeps them; this policy never passes, which
# keeps them from running. Do not delete this policy while any instance may still have those bindings: they would then
# run for every administrator.
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-mfa-fewer-than-two-passkeys
  attrs:
    execution_logging: false
    expression: return False
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-mfa-has-no-passkey
  attrs:
    execution_logging: false
    expression: |-
      from authentik.stages.authenticator_webauthn.models import WebAuthnDevice
      return not WebAuthnDevice.objects.filter(user=request.user, confirmed=True).exists()
- model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
  identifiers:
    name: default-authenticator-webauthn-setup
  attrs:
    authenticator_attachment: null
    configure_flow: !Find [authentik_flows.flow, [slug, default-authenticator-webauthn-setup]]
    device_type_restrictions: []
    friendly_name: Passkey
    hints: []
    max_attempts: 0
    resident_key_requirement: required
    user_verification: required
- model: authentik_stages_authenticator_totp.authenticatortotpstage
  identifiers:
    name: default-authenticator-totp-setup
  attrs:
    configure_flow: !Find [authentik_flows.flow, [slug, default-authenticator-totp-setup]]
    digits: '6'
    friendly_name: Authenticator app
- model: authentik_stages_authenticator_static.authenticatorstaticstage
  identifiers:
    name: default-authenticator-static-setup
  attrs:
    configure_flow: !Find [authentik_flows.flow, [slug, default-authenticator-static-setup]]
    friendly_name: Recovery codes
    token_count: 10
    token_length: 12
# Login flow `tak-auth`. After the identification stage (order 10), in order:
#   15  break-glass accounts are refused
#   20  ordinary user with any authenticator: asked for one (a passkey, an authenticator app or a recovery code)
#   21  administrator with authenticators but no passkey: proves an authenticator before a new passkey is registered
#   22  administrator: asked for a passkey, or enrols the first one
#   30  ordinary user without a passkey or authenticator app: enrols one (passkey or authenticator app)
#   40  ordinary user with fewer than two authenticators: receives recovery codes
#   41  administrator with fewer than two authenticators: receives recovery codes
#  100  login
# An administrator needs a passkey (the login accepts nothing else for one) and one more authenticator of any kind,
# which is the recovery codes. The passkey screen is shown in front of the registration, where it is asked for.
- model: authentik_stages_prompt.prompt
  identifiers:
    name: tak-admin-passkey-heading
  attrs:
    field_key: tak_admin_passkey_heading
    initial_value: '<strong>Add a passkey</strong>'
    initial_value_expression: false
    label: Information
    order: 0
    placeholder: ''
    placeholder_expression: false
    required: false
    sub_text: ''
    type: static
- model: authentik_stages_prompt.prompt
  identifiers:
    name: tak-admin-passkey-text
  attrs:
    field_key: tak_admin_passkey_text
    initial_value: 'Administrators sign in with a passkey. Your browser or device will now ask you to create it. Next you get recovery codes.'
    initial_value_expression: false
    label: Information
    order: 1
    placeholder: ''
    placeholder_expression: false
    required: false
    sub_text: ''
    type: static
- model: authentik_stages_prompt.promptstage
  identifiers:
    name: tak-admin-passkey-intro
  attrs:
    fields:
    - !Find [authentik_stages_prompt.prompt, [name, tak-admin-passkey-heading]]
    - !Find [authentik_stages_prompt.prompt, [name, tak-admin-passkey-text]]
    validation_policies: []
# An administrator who has authenticators but no passkey (for example after the passkey was removed) proves one of them
# before a new passkey can be registered, so that a password alone does not add a passkey to an administrator account.
- model: authentik_stages_authenticator_validate.authenticatorvalidatestage
  identifiers:
    name: tak-authentication-mfa-validation-admin-fallback
  attrs:
    configuration_stages: []
    device_classes:
    - static
    - totp
    email_otp_throttling_factor: 1.0
    last_auth_threshold: seconds=0
    not_configured_action: skip
    sms_otp_throttling_factor: 1.0
    static_otp_throttling_factor: 1.0
    totp_otp_throttling_factor: 1.0
    webauthn_allowed_device_types: []
    webauthn_hints: []
    webauthn_user_verification: required
- model: authentik_stages_deny.denystage
  identifiers:
    name: tak-authentication-break-glass-deny
  attrs:
    deny_message: This account cannot sign in on this page.
- model: authentik_stages_authenticator_validate.authenticatorvalidatestage
  identifiers:
    name: tak-authentication-mfa-validation-user
  attrs:
    configuration_stages: []
    device_classes:
    - static
    - totp
    - webauthn
    email_otp_throttling_factor: 1.0
    last_auth_threshold: seconds=0
    not_configured_action: skip
    sms_otp_throttling_factor: 1.0
    static_otp_throttling_factor: 1.0
    totp_otp_throttling_factor: 1.0
    webauthn_allowed_device_types: []
