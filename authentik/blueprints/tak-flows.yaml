    layout: stacked
    name: tak-source-enrollment-email-verification
    policy_engine_mode: any
    title: Verify your Email to connect this service
- model: authentik_flows.flow
  identifiers:
    slug: tak-user-settings
  attrs:
    authentication: require_authenticated
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: stage_configuration
    layout: stacked
    name: User settings
    policy_engine_mode: any
    title: Update your info
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-password-change]]
    stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
    order: 0
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-source-authentication]]
    stage: !Find [authentik_stages_user_login.userloginstage, [name, default-source-authentication-login]]
    order: 0
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-password-change]]
    stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
    order: 1
  attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
- model: authentik_stages_captcha.captchastage
  identifiers:
    name: tak-captcha-stage
  attrs:
    api_url: https://www.recaptcha.net/recaptcha/api/siteverify
    error_on_invalid_score: false
    interactive: false
    js_url: https://www.recaptcha.net/recaptcha/api.js
    public_key: !Env 'TAK_CAPTCHA_SITE_KEY'
    request_content_type: application/x-www-form-urlencoded
    score_max_threshold: 1.0
    score_min_threshold: 0.5
    private_key: !Env 'TAK_CAPTCHA_SECRET_KEY'
  conditions:
  - !Env [TAK_CAPTCHA_SITE_KEY, '']
  - !Env [TAK_CAPTCHA_SECRET_KEY, '']
- model: authentik_sources_oauth.oauthsource
  state: created
  identifiers:
    slug: google
  attrs:
    name: Log in with Google
    provider_type: google
    enabled: false
    consumer_key: set-in-the-admin-ui
    consumer_secret: set-in-the-admin-ui
- model: authentik_sources_oauth.oauthsource
  identifiers:
    slug: google
  attrs:
    access_token_url: https://oauth2.googleapis.com/token
    additional_scopes: ''
    authentication_flow: !Find [authentik_flows.flow, [slug, tak-source-authentication]]
    authorization_code_auth_method: basic_auth
    authorization_url: https://accounts.google.com/o/oauth2/v2/auth
    enrollment_flow: null
    group_matching_mode: identifier
    group_property_mappings: []
    name: Log in with Google
    oidc_jwks_url: https://www.googleapis.com/oauth2/v3/certs
    oidc_well_known_url: ''
    pkce: S256
    policy_engine_mode: any
    profile_url: https://openidconnect.googleapis.com/v1/userinfo
    promoted: false
    provider_type: google
    request_token_url: null
    user_matching_mode: email_link
    user_path_template: goauthentik.io/sources/%(slug)s
    user_property_mappings: []
- model: authentik_sources_oauth.oauthsource
