# --- Activation and recovery -------------------------------------------------------------------------------
# One flow, `tak-recovery-flow`, serves three cases. All of them start with a user who has been identified, either
# by the email link of the self-service recovery or by the one-time link that TAK Team Manager issues (POST
# /core/users/{id}/recovery/, valid 24 hours, which skips the identification and email stages).
#   - The account is inactive, belongs to `tak-break-glass`, or has no authenticator and no open activation window
#     (the user attribute `tak_activation_expires`, an ISO 8601 time that Team Manager sets when it sends the
#     link): refused at order 22.
#   - The user has an authenticator (recovery of an account that was already set up): proves possession of one
#     before the new password prompt (order 26, an administrator with a passkey only). An administrator without a
#     passkey is refused: an administrator has to reset it.
#   - The user has none and the window is open (first activation): no proof beyond the link.
# Then the new password (30, 40). A user with fewer than two authenticators enrols the rest here: the same rules
# and stages as `tak-auth` (50 to 60). There is no login stage: the flow ends with a redirect to / (100), which sends
# the user to the login page. A plain address, not the login flow, so that the flow token is not carried along.
# The refusal of the recovery flow. A flow keeps a copy of the identified user from the moment its link was made
# (up to 24 hours), so the account could have been suspended since, or had its attributes changed (Team Manager
# updates them all the time), and the password write at the end would save that old copy over the current row:
# it switched a suspended account back on and reverted the attributes. So this policy first reads the user again
# and puts the fresh copy into the flow, then decides on it, and every later stage works on the current account.
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-recovery-refuse
  attrs:
    execution_logging: false
    expression: |-
      from datetime import datetime, timezone
      from authentik.core.models import User
      if not request.user.pk:
          return True
      user = User.objects.get(pk=request.user.pk)
      plan = request.context.get('flow_plan')
      if plan is not None:
          plan.context['pending_user'] = user
      if not user.is_active:
          return True
      if user.groups.filter(name='tak-break-glass').exists():
          return True
      if ak_user_has_authenticator(user):
          return False
      value = user.attributes.get('tak_activation_expires')
      if not value:
          return True
      try:
          expires = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
      except ValueError:
          return True
      if expires.tzinfo is None:
          expires = expires.replace(tzinfo=timezone.utc)
      return expires <= datetime.now(timezone.utc)
