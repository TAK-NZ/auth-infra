    recovery_flow: null
    show_matched_user: true
    show_source_labels: false
    sources: []
    user_fields:
    - email
    webauthn_stage: null
- model: authentik_flows.flowstagebinding
  identifiers:
    target: !Find [authentik_flows.flow, [slug, tak-source-enrollment-email-verification]]
    stage: !Find [authentik_stages_identification.identificationstage, [name, tak-identify-by-email]]
