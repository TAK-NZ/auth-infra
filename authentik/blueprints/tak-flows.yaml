# Changing an authenticator in the user settings asks for one first, unless the user passed this check in this browser
# in the last 5 minutes (NZISM 16.1.36, proof of ownership). Authentik remembers that in the cookie `authentik_mfa`,
# which it sets only for a validate stage with a threshold, so only this check sets it. The check sits before the
# setup stage (order 0) of each setup flow, in an administrator and an ordinary variant, and a screen in front of it
# (order -30) says why the user is asked, whenever the check will run.
- model: authentik_flows.flow
  identifiers:
    slug: default-authenticator-webauthn-setup
  attrs:
    authentication: require_authenticated
    designation: stage_configuration
    name: default-authenticator-webauthn-setup
    title: Add a passkey
- model: authentik_flows.flow
  identifiers:
    slug: default-authenticator-totp-setup
  attrs:
    authentication: require_authenticated
    designation: stage_configuration
    name: default-authenticator-totp-setup
    title: Add an authenticator app
- model: authentik_flows.flow
  identifiers:
    slug: default-authenticator-static-setup
  attrs:
    authentication: require_authenticated
    designation: stage_configuration
    name: default-authenticator-static-setup
    title: Get recovery codes
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-mfa-reauth-needed
  attrs:
    execution_logging: false
    expression: |-
      # authentik_mfa is set only after this check was passed, and lasts 5 minutes
      http_request = request.http_request
      if http_request is None:
          return True
      return 'authentik_mfa' not in http_request.COOKIES
