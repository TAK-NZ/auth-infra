# Screens of the recovery flow that tell the user what is going on. Authentik's own stages (the choice of an
# authenticator, the passkey registration, the recovery codes) carry no explanation, so a prompt stage with only
# static text goes in front of them, and the password screen has a heading and a description of its own. The
# static fields accept HTML and, with initial_value_expression, a Python expression for the identified user.
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: tak-mfa-needs-enrolment
  attrs:
    execution_logging: false
    expression: |-
      user = request.user
      from authentik.stages.authenticator_static.models import StaticToken
      from authentik.stages.authenticator_totp.models import TOTPDevice
      from authentik.stages.authenticator_webauthn.models import WebAuthnDevice
      passkeys = WebAuthnDevice.objects.filter(user=user, confirmed=True).count()
      apps = TOTPDevice.objects.filter(user=user, confirmed=True).count()
      codes = StaticToken.objects.filter(device__user=user, device__confirmed=True).exists()
      if user.is_superuser:
          needs_enrolment = passkeys < 1 or passkeys + apps + (1 if codes else 0) < 2
      else:
          needs_enrolment = (passkeys + apps == 0) or (passkeys + apps + (1 if codes else 0) < 2)
      return needs_enrolment
