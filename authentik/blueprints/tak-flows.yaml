# TAK login experience: login, passkey login, password change, user settings, access request (enrollment),
# password recovery, and the social login flows and sources.
#
# One file on purpose. These objects reference each other in a circle (the identification stage lists the
# sources, the sources use the source flows, the identification stage links the recovery and enrollment
# flows), and splitting them made Authentik re-apply the same blueprints several times over.
#
# Objects are identified by slug or name, so the file works in any instance and adopts objects that were
# first created by hand. It is applied at startup and again whenever it changes.
#
# Social login sources (Google, Apple). Each has two entries:
#   1. `state: created` makes a disabled shell with placeholder credentials, only if the source is missing.
#      An existing source is never touched by it.
#   2. The second entry keeps the structure (URLs, flows, matching rules) in step with this file. It does not
#      carry the client ID, client secret, icon or enabled flag, so the values set in the admin UI survive.
#   After the first deploy, open Directory > Federation and Social login in the admin UI, enter the client ID
#   and secret from the Google or Apple developer console for this domain, and enable the source.
#
# Entries with `conditions` are skipped while their environment variables are empty, and left as they are if
# they already exist:
#   TAK_TEAM_MANAGER_URL                           request-access redirect (https://team.<zone>); set by the stack
#   TAK_CAPTCHA_SITE_KEY / TAK_CAPTCHA_SECRET_KEY  captcha on password recovery and login
# The identification stage therefore appears twice. The first entry holds its settings; the last one repeats
# them with the captcha link (Authentik validates the whole stage on every update).
#
# `default-recovery-*` come from Authentik's example recovery blueprint, which this stack does not apply, so
# they are defined here under their existing names.
version: 1
metadata:
  name: TAK - Flows and sources
  labels:
    blueprints.goauthentik.io/description: |
      Login, passkey, password change, user settings, enrollment, recovery and social login flows, and the Google and Apple login sources.
entries:
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Authentication flow
    required: true
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Password change flow
    required: true
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - Source authentication flow
    required: true
- model: authentik_blueprints.metaapplyblueprint
  attrs:
    identifiers:
      name: Default - User settings flow
    required: true
# Break-glass accounts (for example the CloudTAK local administrator). Members are skipped by the MFA
# rules and denied in the web login flows once those rules are in place. The blueprint only creates the
# group; the account that owns the sealed credential is added to it by the stack that creates the account.
- model: authentik_core.group
  identifiers:
    name: tak-break-glass
  attrs:
    is_superuser: false
- model: authentik_flows.flow
  identifiers:
    slug: tak-auth
  attrs:
    authentication: none
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: authentication
    layout: stacked
    name: tak-authentication-flow
    policy_engine_mode: any
    title: TAK.NZ Login
- model: authentik_flows.flow
  identifiers:
    slug: tak-enrollment
  attrs:
    authentication: none
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: enrollment
    layout: stacked
    name: tak-enrollment
    policy_engine_mode: any
    title: Request TAK.NZ Access
- model: authentik_flows.flow
  identifiers:
    slug: tak-passkey
  attrs:
    authentication: none
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: authentication
    layout: stacked
    name: tak-passwordless-flow
    policy_engine_mode: any
    title: TAK.NZ Login
- model: authentik_flows.flow
  identifiers:
    slug: tak-password-change
  attrs:
    authentication: require_authenticated
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: stage_configuration
    layout: stacked
    name: Change Password
    policy_engine_mode: any
    title: Change password
- model: authentik_flows.flow
  identifiers:
    slug: tak-recovery-flow
  attrs:
    authentication: require_unauthenticated
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: recovery
    layout: stacked
    name: TAK recovery flow
    policy_engine_mode: any
    title: Reset your password
- id: flow-tak-source-authentication
  model: authentik_flows.flow
  identifiers:
    slug: tak-source-authentication
  attrs:
    authentication: require_unauthenticated
    background: ''
    compatibility_mode: true
    denied_action: message_continue
    designation: authentication
    layout: stacked
    name: tak-source-authentication
    policy_engine_mode: any
    title: TAK.NZ Login
- id: flow-tak-source-enrollment-email-verification
  model: authentik_flows.flow
  identifiers:
    slug: tak-source-enrollment-email-verification
  attrs:
    authentication: none
